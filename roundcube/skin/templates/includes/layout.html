<roundcube:add_label name="back" />
<roundcube:add_label name="errortitle" />
<roundcube:add_label name="options" />
<roundcube:add_label name="plaintoggle" />
<roundcube:add_label name="htmltoggle" />
<roundcube:add_label name="previous" />
<roundcube:add_label name="next" />
<roundcube:add_label name="select" />
<roundcube:add_label name="close" />
<roundcube:add_label name="browse" />
<roundcube:add_label name="choosefile" />
<roundcube:add_label name="choosefiles" />
<roundcube:object name="doctype" value="html5" />
<roundcube:if condition="!env:framed || env:extwin" />
<html>
<roundcube:else />
<html class="iframe">
<roundcube:endif />
<head>
	<roundcube:object name="meta" />
	<link rel="icon" href="skins/underwings/images/favicon.ico" sizes="any">
	<link rel="icon" href="skins/underwings/images/favicon-32x32.png" type="image/png" sizes="32x32">
	<link rel="icon" href="skins/underwings/images/favicon-16x16.png" type="image/png" sizes="16x16">
	<link rel="stylesheet" href="skins/elastic/deps/bootstrap.min.css">
	<roundcube:if condition="config:devel_mode" />
		<link rel="stylesheet/less" href="/styles/styles.less">
		<script src="skins/elastic/deps/less.min.js" data-env="development"></script>
	<roundcube:else />
		<link rel="stylesheet" href="skins/elastic/styles/styles.min.css">
		<link rel="stylesheet" href="skins/elastic/styles/print.min.css" media="print">
	<roundcube:endif />
	<roundcube:object name="links" />
	<roundcube:if condition="env:task == 'login'" />
		<link rel="stylesheet" href="skins/underwings/styles/login.css">
	<roundcube:endif />
	<roundcube:if condition="env:action != 'print'" />
		<roundcube:if condition="env:task != 'login'" />
			<script>try{document.documentElement.classList.add('dark-mode');}catch(e){}</script>
		<roundcube:endif />
	<roundcube:endif />
</head>
<body class="task-<roundcube:exp expression="env:error_task ?: env:task ?: 'error'"> action-<roundcube:exp expression="asciiwords(env:action, true, '-') ?: 'none'">">
	<roundcube:if condition="!env:framed || env:extwin" />
		<div id="<roundcube:exp expression="env:action == 'print' ? 'print-' : ''">layout">
	<roundcube:endif />
