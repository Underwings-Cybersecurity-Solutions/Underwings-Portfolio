# ===========================================
# NGINX CONFIGURATION - PRODUCTION
# Underwings Cybersecurity Solutions
# underwings.org
# ===========================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # ---------------------------------------------------------------
    # Cloudflare fronts most sites on this box. Recover the visitor's IP
    # from CF-Connecting-IP so limit_req, X-Real-IP and the access log key
    # on people, not on Cloudflare edge nodes (which made the per-IP rate
    # limits both bypassable and able to throttle unrelated visitors).
    # Only trusted when the connection really comes from a Cloudflare
    # range, so unproxied sites are unaffected. Ranges: cloudflare.com/ips
    # (fetched 2026-08-27).
    # ---------------------------------------------------------------
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/rss+xml application/atom+xml image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=form_limit:10m rate=2r/s;

    # ===========================================
    # UPSTREAM SERVERS
    # ===========================================
    upstream frontend { server frontend:4321; }
    upstream admin    { server admin:5173; }
    upstream studio   { server studio:3000; }
    upstream kong     { server kong:8000; }
    upstream stalwart { server stalwart:8080; }
    upstream crm      { server crm:5173; }

    # ===========================================
    # Catch-all default server — MUST stay first.
    #
    # Without an explicit default_server, nginx falls back to the *first*
    # matching listen block, which meant an unconfigured hostname pointed at
    # this box silently borrowed underwings.org's certificate and triggered
    # browser cert-mismatch warnings (see www.mycosmicstar.com, 2026-08-06).
    #
    # On 443 we reject the TLS handshake outright rather than present a
    # mismatched cert. ACME challenges are still answered on port 80 so a new
    # domain can be issued a cert before it has a server block of its own.
    # ===========================================
    server {
        listen 80 default_server;
        server_name _;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        # Docker's healthcheck wgets 0.0.0.0:80/health, which lands here (Host
        # "0.0.0.0" matches no vhost). The 444 catch-all closed the connection
        # unanswered, so the container sat permanently "unhealthy".
        location = /health { access_log off; return 200 "ok\n"; }
        location / { return 444; }
    }

    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;
        ssl_reject_handshake on;
    }

    # ===========================================
    # HTTP → HTTPS redirect + ACME challenge
    # ===========================================
    server {
        listen 80;
        server_name underwings.org www.underwings.org;

        # Let's Encrypt webroot renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://underwings.org$request_uri;
        }
    }

    # ===========================================
    # HTTPS — Main Production Server
    # ===========================================
    server {
        listen 443 ssl;
        http2 on;
        server_name underwings.org www.underwings.org;

        # SSL
        ssl_certificate     /etc/letsencrypt/live/underwings.org-0001/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/underwings.org-0001/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # www → non-www redirect
        if ($host = www.underwings.org) {
            return 301 https://underwings.org$request_uri;
        }

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        error_page 502 503 504 /maintenance.html;
        location = /maintenance.html {
            root /usr/share/nginx/html;
            internal;
        }

        # ===========================================
        # Legacy Webflow .html URL redirects (SEO)
        # Pre-Astro-migration URLs that Google still has indexed.
        # Discovered via Search Console — see PRELAUNCH-8 SEO audit.
        # Targets point straight at the current IA so nothing hops through the
        # /services/vapt and /services/iso-27001 redirects below.
        # ===========================================
        location = /index.html              { return 301 https://underwings.org/; }
        location = /grc-services.html       { return 301 https://underwings.org/services/grc/iso-27001-implementation; }
        location = /pentest-altayaboon.html { return 301 https://underwings.org/services/offensive-security/network-penetration-testing; }

        # Catch-all: any other ROOT-LEVEL legacy *.html URL → homepage. Webflow
        # exported flat pages only, so nested paths are excluded on purpose —
        # /brand/BRAND-GUIDELINES.html is a real static asset. /maintenance.html
        # is matched by its exact `location =` block above (exact matches take
        # priority over regex), so it is not affected either.
        location ~ ^/[^/]+\.html$ {
            return 301 https://underwings.org/;
        }

        location /health {
            access_log off;
            return 200 "ok";
            add_header Content-Type text/plain;
        }

        # ===========================================
        # 301 redirects — legacy service URLs → new IA (Apr 2026)
        # Old flat /services/* → new 5-category × 15-service structure
        # ===========================================
        location = /services/vapt {
            return 301 https://underwings.org/services/offensive-security/network-penetration-testing;
        }
        location = /services/iso-27001 {
            return 301 https://underwings.org/services/grc/iso-27001-implementation;
        }
        location = /services/security-audit {
            return 301 https://underwings.org/services/grc;
        }
        location = /services/consultation {
            return 301 https://underwings.org/services/grc;
        }
        location = /services/training {
            return 301 https://underwings.org/services/training-awareness/security-awareness-training;
        }

        # Legacy standalone pages removed in the Astro migration → 301 to live targets
        # (these returned 404 in the 2026-04 crawl). /portal target TBD — see audit doc.
        location = /contact {
            return 301 https://underwings.org/#contact;
        }

        # Frontend — main site
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
        }

        # Static assets with caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        }

        # Form endpoints
        location = /api/contact {
            limit_req zone=form_limit burst=5 nodelay;
            proxy_pass http://frontend/api/contact;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location = /api/tts {
            limit_req zone=form_limit burst=3 nodelay;
            proxy_pass http://frontend/api/tts;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location = /api/newsletter {
            limit_req zone=form_limit burst=3 nodelay;
            proxy_pass http://frontend/api/newsletter;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Waitlist signups for Y2/Y3 Coming Soon services (category hub pages)
        location = /api/waitlist {
            limit_req zone=form_limit burst=5 nodelay;
            proxy_pass http://frontend/api/waitlist;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location = /api/partners {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://frontend/api/partners;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location = /api/chat {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass http://frontend/api/chat;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location = /api/updates {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://frontend/api/updates;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Brevo delivery webhook (bounces/spam/unsubs → CRM email hygiene).
        # Token-authenticated in the endpoint itself; burst is generous
        # because a campaign send produces bounce bursts, and a 429'd Brevo
        # retry storm is worse than letting the events straight through.
        location = /api/brevo-events {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://frontend/api/brevo-events;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location /api/admin/ {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            limit_req zone=form_limit burst=5 nodelay;
            proxy_pass http://frontend/api/admin/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Supabase API
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://kong/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location /auth/ {
            limit_req zone=form_limit burst=5 nodelay;
            proxy_pass http://kong/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /rest/ {
            proxy_pass http://kong/rest/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /storage/ {
            proxy_pass http://kong/storage/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /realtime/ {
            proxy_pass http://kong/realtime/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        # Admin Dashboard (private networks only)
        location ^~ /admin/ {
            limit_req zone=form_limit burst=5 nodelay;
            proxy_pass http://admin/admin/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /admin { return 301 /admin/; }

        # Supabase Studio (private networks only - see mail.underwings.org for mail admin)
        location ^~ /supabase/ {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            limit_req zone=form_limit burst=5 nodelay;
            proxy_pass http://studio/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ===========================================
    # mail.underwings.org — Stalwart Admin UI
    # ===========================================
    server {
        listen 80;
        server_name mail.underwings.org;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://mail.underwings.org$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name mail.underwings.org;

        ssl_certificate     /etc/letsencrypt/live/mail.underwings.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mail.underwings.org/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        location / {
            # No nginx rate limit here: Stalwart admin UI is auth-gated and
            # Stalwart applies its own auto-ban (server.blocked-ip.*) on
            # failed admin auth. Per-vhost rate-limits were causing 503s on
            # parallel asset/API fetches during normal SPA navigation.
            proxy_pass http://stalwart/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }

    # ===========================================
    # plan.underwings.org — Plane Project Management

    # ===========================================
    server {
        listen 80;
        server_name plan.underwings.org;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://plan.underwings.org$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name plan.underwings.org;

        ssl_certificate     /etc/letsencrypt/live/plan.underwings.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/plan.underwings.org/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
