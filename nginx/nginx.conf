    # ===========================================
    # mycosmicstar.com — Cosmicstar Portfolio (Next.js + Supabase)
    # App: cosmicstar-app on host 3002 (Next.js standalone)
    # API: cosmicstar-kong on host 8000 (Supabase gateway)
    # www.mycosmicstar.com now points here (CNAME → apex) and IS in this cert
    # as of 2026-08-06. It 301s to the apex, which is the canonical host used
    # by app/sitemap.ts and all canonical/OG URLs in lib/seo.ts.
    # ===========================================
    server {
        listen 80;
        server_name mycosmicstar.com www.mycosmicstar.com;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://mycosmicstar.com$request_uri; }
    }

    # www → apex redirect (needs its own TLS block so the handshake presents the
    # mycosmicstar cert; without this it fell through to the underwings.org
    # default server and browsers reported a cert-mismatch they could not bypass,
    # because the apex sends HSTS with includeSubDomains.)
    server {
        listen 443 ssl;
        http2 on;
        server_name www.mycosmicstar.com;

        ssl_certificate     /etc/letsencrypt/live/mycosmicstar.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mycosmicstar.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / { return 301 https://mycosmicstar.com$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name mycosmicstar.com;

        ssl_certificate     /etc/letsencrypt/live/mycosmicstar.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mycosmicstar.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        client_max_body_size 25m;

        location / {
            proxy_pass http://172.17.0.1:3002;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }
    }

