    # ===========================================
    # crm.underwings.org — standalone CRM app (same-origin Supabase via kong)
    # ===========================================
    server {
        listen 80;
        server_name crm.underwings.org;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://crm.underwings.org$request_uri; }
    }
    server {
        listen 443 ssl;
        http2 on;
        server_name crm.underwings.org;
        ssl_certificate     /etc/letsencrypt/live/crm.underwings.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/crm.underwings.org/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        # The CRM holds customer PII and keeps its Supabase session in
        # localStorage, so an XSS here is a data-exfiltration event. script-src
        # 'self' is possible because the runtime config moved out of an inline
        # <script> into /env.js. style-src keeps 'unsafe-inline' for the inline
        # style attributes the board uses for bar widths; img-src allows data:
        # for the MFA enrolment QR code; connect-src is same-origin because kong
        # is proxied under this very host.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'" always;
        client_max_body_size 20m;

        # Supabase (same-origin) — mirror the main-vhost kong proxies.
        # Rate-limit auth to blunt brute-force on the public login.
        location /auth/ {
            limit_req zone=form_limit burst=5 nodelay;
            proxy_pass http://kong/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /rest/ {
            proxy_pass http://kong/rest/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /storage/ {
            proxy_pass http://kong/storage/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location /realtime/ {
            proxy_pass http://kong/realtime/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        # CRM SPA
        location / {
            proxy_pass http://crm;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }



    # ---- umacerts.ae (company website, added 2026-08-11) ----
    server {
        listen 80;
        server_name umacerts.ae www.umacerts.ae;

        # Renewal depends on this. Removing it breaks TLS about 60 days later,
        # silently — the certificate does not fail on the day the block is deleted.
        location /.well-known/acme-challenge/ { root /var/www/certbot; }

        location / { return 301 https://umacerts.ae$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name umacerts.ae;

        ssl_certificate     /etc/letsencrypt/live/umacerts.ae/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/umacerts.ae/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # No `includeSubDomains`. This domain may later carry subdomains that are
        # set up before their certificates are, and an HSTS entry inherited from the
        # apex makes that failure UNBYPASSABLE in the browser rather than merely a
        # warning. The apex and www are what we are protecting here.
        add_header Strict-Transport-Security "max-age=31536000" always;

        # NO `expires` ANYWHERE IN THIS BLOCK. `expires` REPLACES the upstream's
        # Cache-Control on proxied responses — one `expires 30d;` here would make
        # the public register cacheable for a month, so a suspension would keep
        # showing as active. All cache policy lives in deploy/site.nginx.conf.

        location / {
            proxy_pass http://umacerts-site:80;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # www is a permanent alias of the apex. The canonical tag on every page points
    # at the apex, and consolidating there is deliberate.
    server {
        listen 443 ssl;
        http2 on;
        server_name www.umacerts.ae;

        ssl_certificate     /etc/letsencrypt/live/umacerts.ae/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/umacerts.ae/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000" always;

        return 301 https://umacerts.ae$request_uri;
    }

    # ===========================================
    # dash.umacerts.ae — UMA ERP demo (front-end only, fixture data).
