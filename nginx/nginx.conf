    # akl.underwings.org TLS (added 2026-07-24)
    server {
        listen 443 ssl;
        http2 on;
        server_name akl.underwings.org;

        ssl_certificate     /etc/letsencrypt/live/akl.underwings.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/akl.underwings.org/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;

        client_max_body_size 5m;

        location / {
            proxy_pass http://alkhaznah-dashboard:8090;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ===========================================
    # erp.underwings.org — UMA platform (separate company; reverse proxy ONLY.
