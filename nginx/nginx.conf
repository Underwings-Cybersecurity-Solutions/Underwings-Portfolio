    # ===========================================
    # mail.underwings.org — Stalwart Admin UI
    # ===========================================
    server {
        listen 80;
        server_name mail.underwings.org;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://mail.underwings.org$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name mail.underwings.org;

        ssl_certificate     /etc/letsencrypt/live/mail.underwings.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mail.underwings.org/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        location / {
            # No nginx rate limit here: Stalwart admin UI is auth-gated and
            # Stalwart applies its own auto-ban (server.blocked-ip.*) on
            # failed admin auth. Per-vhost rate-limits were causing 503s on
            # parallel asset/API fetches during normal SPA navigation.
            proxy_pass http://stalwart/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }

