    # catch-all default_server (444 / ssl_reject_handshake), which is intended.

    # ===========================================
    # pitstack.ae — Pitstack IT services site
    # Container: itco-web (Astro node adapter, port 4321)
    #
    # Moved from pitstack.io on 2026-08-15. The .io names stay as permanent
    # 301s to the .ae apex (their cert keeps renewing via the ACME location
    # below) so old links, search results and cached bookmarks still land.
    # ===========================================
    server {
        listen 80;
        server_name pitstack.ae www.pitstack.ae pitstack.io www.pitstack.io;

        # Renewal depends on this. Removing it breaks TLS about 60 days later,
        # silently — the certificate does not fail on the day the block is deleted.
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://pitstack.ae$request_uri; }
    }

    # www.pitstack.ae → apex
    server {
        listen 443 ssl;
        http2 on;
        server_name www.pitstack.ae;

        ssl_certificate     /etc/letsencrypt/live/pitstack.ae/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pitstack.ae/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        return 301 https://pitstack.ae$request_uri;
    }

    # Old domain: pitstack.io + www → new apex (served with the .io cert)
    server {
        listen 443 ssl;
        http2 on;
        server_name pitstack.io www.pitstack.io;

        ssl_certificate     /etc/letsencrypt/live/pitstack.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pitstack.io/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        return 301 https://pitstack.ae$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name pitstack.ae;

        ssl_certificate     /etc/letsencrypt/live/pitstack.ae/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pitstack.ae/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # The site loads no third-party assets: fonts are self-hosted and there
        # is no external script. Keep it that way and this stays tight.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self' https://static.cloudflareinsights.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

        client_max_body_size 2m;

        # Runtime DNS. A literal hostname would be resolved once at startup and
        # cached, so a redeploy onto a new container IP would 502 until nginx
        # itself restarted.
        resolver 127.0.0.11 valid=10s;

        # Lead form: throttled at the edge as well as inside the application.
        location = /api/lead {
            limit_req zone=form_limit burst=5 nodelay;

            set $itco http://itco-web:4321;
            proxy_pass $itco$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            set $itco http://itco-web:4321;
            proxy_pass $itco$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

