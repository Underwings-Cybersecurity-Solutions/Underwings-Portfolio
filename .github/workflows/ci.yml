# ===========================================
# CI Pipeline - Build & Validate
# Underwings Technologies
# ===========================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ===========================================
  # Build Frontend (Astro)
  # ===========================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Matches the production Dockerfile (RUN npm install). npm ci is avoided
      # because the committed lockfile is not kept strictly in sync.
      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL: http://localhost:8000
          PUBLIC_SUPABASE_ANON_KEY: placeholder-for-ci
          PUBLIC_SITE_URL: https://underwings.org

      - name: Verify build output
        run: |
          test -f dist/server/entry.mjs || (echo "Missing server entry" && exit 1)
          test -f dist/client/sitemap-index.xml || (echo "Missing sitemap" && exit 1)
          echo "Build output verified"

  # ===========================================
  # Build Admin Dashboard
  # ===========================================
  build-admin:
    name: Build Admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # admin has no committed lockfile; matches its Dockerfile (RUN npm install).
      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html || (echo "Missing index.html" && exit 1)
          echo "Admin build verified"

  # ===========================================
  # Build CRM (Vite SPA)
  # Previously untested in CI while deploy.yml built it on every green run —
  # a syntax error in crm.js only surfaced in the deploy builder stage.
  # ===========================================
  build-crm:
    name: Build CRM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # crm has no committed lockfile; matches its Dockerfile (RUN npm install).
      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f ../dist/index.html || (echo "Missing index.html" && exit 1)
          test -f ../dist/env.js || (echo "Missing runtime env.js" && exit 1)
          grep -q '__SUPABASE_URL__' ../dist/env.js || (echo "env.js placeholder was substituted at build time — the entrypoint expects it at runtime" && exit 1)
          echo "CRM build verified"

  # ===========================================
  # LeadGen pipeline tests (zero deps, node:test)
  # ===========================================
  test-leadgen:
    name: Test LeadGen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: leadgen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No dependencies to install — the pipeline is pure Node 20.
      - name: Run tests
        run: node --test test/

  # ===========================================
  # Build Docker Images
  # ===========================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build-frontend, build-admin, build-crm, test-leadgen]

    steps:
      - uses: actions/checkout@v4

      - name: Build frontend image
        run: |
          docker build \
            --build-arg PUBLIC_SUPABASE_URL=http://localhost:8000 \
            --build-arg PUBLIC_SUPABASE_ANON_KEY=placeholder-for-ci \
            -t underwings-frontend:ci \
            frontend

      - name: Build admin image
        run: docker build -t underwings-admin:ci admin

      - name: Build nginx image
        run: docker build -t underwings-nginx:ci nginx

      - name: Verify frontend container starts
        run: |
          docker run -d --name frontend-test \
            -e PUBLIC_SUPABASE_URL=http://localhost:8000 \
            -e PUBLIC_SUPABASE_ANON_KEY=placeholder \
            -e PUBLIC_SITE_URL=https://underwings.org \
            -p 4321:4321 \
            underwings-frontend:ci
          sleep 5
          curl -sf -o /dev/null http://localhost:4321/ && echo "Frontend healthy" || (docker logs frontend-test && exit 1)
          docker stop frontend-test
