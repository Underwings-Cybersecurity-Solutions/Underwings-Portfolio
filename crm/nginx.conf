server {
    listen 5173;
    server_name localhost;
    root /usr/share/nginx/html;

    # Real liveness endpoint. Everything else falls through to /index.html via
    # try_files, so ANY path returns 200 — probing an arbitrary URL (as the old
    # healthcheck did, using Frappe's /api/method/ping) is a permanent false
    # green. This returns a distinctive body a monitor can actually assert on.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "underwings-crm ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
